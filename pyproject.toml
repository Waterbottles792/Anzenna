[project]
name = "anzenna"
version = "0.1.0"
description = "LLM prompt-injection & jailbreak firewall"
requires-python = ">=3.11"
dependencies = ["google-genai", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only needed to run real classifier inference (engine/classifier.py). The
# test suite mocks inference and does not require these -- heavy/optional.
ml = ["transformers>=4.40", "torch>=2.2"]
# Only needed to actually run sdks/mcp/server.py as a server. The test suite
# skips the server-registration tests when this isn't installed.
mcp = ["mcp>=2.0"]
# api/models.py, api/db.py, and alembic migrations (Phase 6). api/test_db.py
# skips itself when no ANZENNA_TEST_DATABASE_URL/DATABASE_URL is set.
db = ["sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1"]
# api/main.py (Phase 7). Requires the `db` extra too. api/test_main.py skips
# itself under the same conditions as api/test_db.py.
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.pytest.ini_options]
testpaths = ["engine", "api", "sdks"]
pythonpath = ["."]
