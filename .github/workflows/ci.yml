name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anzenna
          POSTGRES_PASSWORD: anzenna
          POSTGRES_DB: anzenna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anzenna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://anzenna:anzenna@localhost:5432/anzenna_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Not `pip install -e .`: the repo root has multiple top-level dirs
      # (engine/, api/, sdks/, dashboard/, infra/) that are separate
      # deployable units by design (see docs/plan.md), not one installable
      # package -- setuptools' flat-layout auto-discovery refuses to build
      # it. Tests resolve imports via pytest's `pythonpath = ["."]` (see
      # pyproject.toml) instead, so just install the actual dependencies.
      - run: pip install pytest PyYAML google-genai "mcp>=2.0" "sqlalchemy>=2.0" "alembic>=1.13" "psycopg[binary]>=3.1" "fastapi>=0.110" httpx
      - run: alembic upgrade head
      - run: pytest
